<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مافيا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --night:#15111b; --panel:#201a28; --panel2:#2a2233; --line:#3a3045;
  --brass:#c9a227; --blood:#9b1d30; --cream:#efe6d8; --muted:#a59cad; --ok:#4f9d69;
  --display:"Reem Kufi","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.6;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:20px 16px 60px}
#app.wide{max-width:1200px}
h1{font-family:var(--display);font-size:44px;font-weight:700;color:var(--brass);line-height:1.1}
h2{font-family:var(--display);font-size:26px;font-weight:700;margin-bottom:10px}
h3{font-size:18px;font-weight:700;margin:18px 0 8px;color:var(--brass)}
p.sub{color:var(--muted)}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--cream);
  font:700 18px var(--body);padding:15px 18px;border-radius:12px;cursor:pointer;margin-top:10px;text-align:center}
.btn.main{background:var(--blood);border-color:var(--blood)}
.btn.gold{background:var(--brass);border-color:var(--brass);color:#1b1408}
.btn.small{display:inline-block;width:auto;font-size:14px;padding:7px 12px;margin:0}
.btn:disabled{opacity:.4}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--cream);font:700 20px var(--body);
  padding:14px;border-radius:12px;text-align:center;margin-top:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.warn{background:#3a2a10;border-color:var(--brass)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dead{opacity:.45;text-decoration:line-through}
.tag{font-size:13px;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.mafia{background:#4a1520;color:#ffc9d0}.tag.people{background:#173226;color:#c6f0d3}.tag.neutral{background:#3a3115;color:#f3e2a6}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.code{font-family:var(--display);font-size:22px;color:var(--brass)}
.phase{font-family:var(--display);font-size:32px;text-align:center;margin:8px 0}
.news{font-size:20px;text-align:center;white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.pick{border:1px solid var(--line);background:var(--panel2);color:var(--cream);font:700 17px var(--body);padding:16px 8px;border-radius:12px;cursor:pointer}
.pick.on{border-color:var(--brass);background:#3b3014}
.log{font-size:14px;color:var(--muted);max-height:220px;overflow:auto}
.center{text-align:center}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--brass);color:#1b1408;
  font-weight:700;padding:10px 18px;border-radius:30px;display:none;z-index:9;max-width:90%}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin-top:10px}
/* the role card */
.card{perspective:1200px;width:min(78vw,300px);aspect-ratio:560/865;margin:16px auto;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;
  border:3px solid var(--brass);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.back{background:repeating-linear-gradient(45deg,#2a1520 0 10px,#22101a 10px 20px)}
.back b{font-family:var(--display);font-size:40px;color:var(--brass)}
.front{background:var(--panel);transform:rotateY(180deg)}
.front .ic{font-size:72px;line-height:1}
.front .nm{font-family:var(--display);font-size:38px;color:var(--brass);margin:8px 0}
.front.pic{padding:0;border:0;overflow:hidden;border-radius:16px;background:#000}.front.pic img{width:100%;height:100%;object-fit:fill;display:block}
.card:not(.flip)+.extra{visibility:hidden}
.extra{text-align:center;color:var(--brass);font-weight:700;margin-top:-4px}
.thumb{width:100%;max-width:260px;display:block;margin:10px auto 0;border-radius:12px}
.front small{color:var(--muted);font-size:15px}
/* TV */
.tv h1{font-size:72px}.tv .phase{font-size:64px}.tv .news{font-size:34px}
.tv .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tv .pick{font-size:24px;cursor:default}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.card .in{transition:none}}

.tag.town{background:#16283f;color:#cfe3ff}
.cardimg{width:min(80vw,300px);display:block;margin:0 auto 12px;border-radius:16px}
</style>
</head>

  12:[3,1,1,7],13:[3,1,1,8],14:[4,1,1,8],15:[4,1,1,9],16:[4,1,1,10]};
function defaultDist(n){
  if(TABLE[n]) return [...TABLE[n]];
  if(n < 6){ const d=n>=3?1:0, t=n>=4?1:0; return [1,d,t,Math.max(0,n-1-d-t)]; }
  const m=Math.floor(n/4); return [m,1,1,n-m-2];
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

const S={screen:params.get('room')?'join':'home',code:null,mode:null,room:null,players:[],votes:{},
  secrets:{},actions:{},secret:null,myAction:null,revealed:false,unsubs:[],joinTV:false};

function stopAll(){S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[];}
function onErr(e){console.error(e);toast('ما في صلاحية أو انقطع الاتصال');}
function enter(code,mode){
  stopAll();
  Object.assign(S,{code,mode,room:null,players:[],votes:{},secrets:{},actions:{},secret:null,myAction:null,revealed:false});
  ls.set('mafia_last',JSON.stringify({code,mode}));
  const on=(q,f)=>S.unsubs.push(q.onSnapshot(f,onErr));
  on(roomRef(code),s=>{
    if(!s.exists){toast('الجلسة انتهت');return leave();}
    const prev=S.room; S.room=s.data();
    if(prev&&prev.gameNo!==S.room.gameNo) S.revealed=false;
    relay(); render();
  });
  on(col('players'),q=>{S.players=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.joinedAt-b.joinedAt);render();});
  on(col('votes'),q=>{S.votes={};q.docs.forEach(d=>S.votes[d.id]=d.data().target);render();});
  if(mode==='host'){
    on(col('secrets'),q=>{S.secrets={};q.docs.forEach(d=>S.secrets[d.id]=d.data());relay();render();});
    on(col('actions'),q=>{S.actions={};q.docs.forEach(d=>S.actions[d.id]=d.data());relay();render();});
  }
  if(mode==='player'){
    on(col('secrets').doc(UID),s=>{S.secret=s.exists?s.data():null;render();});
    on(col('actions').doc(UID),s=>{S.myAction=s.exists?s.data():null;render();});
  }
  S.screen='room'; render();
}
function leave(){stopAll();Object.assign(S,{room:null,code:null,mode:null,screen:'home'});ls.del('mafia_last');history.replaceState(null,'',location.pathname);render();}

/* ---------- create / join ---------- */
async function createRoom(){
  if(!ready()) return toast('انتظر ثواني لين يتصل');
  let code;
  for(let i=0;i<6;i++){code=String(1000+rnd(9000));const s=await roomRef(code).get();if(!s.exists)break;}
  await roomRef(code).set({code,hostUid:UID,status:'lobby',round:0,gameNo:0,news:'',winner:null,reveal:null,customDist:null,created:Date.now()});
  enter(code,'host');
}
async function joinFlow(code){
  if(!ready()) return toast('انتظر ثواني لين يتصل');
  if(!/^\d{4}$/.test(code)) return toast('اكتب كود من 4 أرقام');
  const s=await roomRef(code).get(); if(!s.exists) return toast('ما في جلسة بهالكود');
  if(S.joinTV){S.joinTV=false;return enter(code,'tv');}
  if(s.data().hostUid===UID) return enter(code,'host');
  S.code=code;
  const p=await col('players').doc(UID).get();
  if(p.exists) return enter(code,'player');
  if(s.data().status!=='lobby') return toast('اللعبة بدت، ما تقدر تدخل الحين');
  S.screen='name'; render();
}
async function joinPlayer(name){
  if(!name) return toast('اكتب اسمك');
  const r=await roomRef(S.code).get();
  if(!r.exists) return toast('ما في جلسة بهالكود');
  if(r.data().status!=='lobby') return toast('اللعبة بدت، ما تقدر تدخل الحين');
  const all=await col('players').get();
  if(all.docs.some(d=>d.data().name===name&&d.id!==UID)) return toast('الاسم مستخدم، اختار اسم ثاني');
  try{ await col('players').doc(UID).set({name,alive:true,points:0,joinedAt:Date.now()}); }
  catch(e){ console.error(e); return toast('ما قدرت تدخل، جرب مرة ثانية'); }
  enter(S.code,'player');
}

/* ---------- host: relay secret info during the night ---------- */
let relayBusy=false;
async function relay(){
  if(relayBusy||S.mode!=='host'||!isHost()||S.room.status!=='night') return;
  const b=db.batch(); let n=0; const round=S.room.round;
  const act=id=>{const a=S.actions[id];return a&&a.round===round?a:null};
  const mafia=Object.keys(S.secrets).filter(id=>roleOf(id)==='mafia');
  const picks={}; mafia.forEach(id=>{const a=act(id);if(a)picks[id]=a.target;});
  mafia.forEach(id=>{if(stable(S.secrets[id].mafiaPicks)!==stable(picks)){b.update(col('secrets').doc(id),{mafiaPicks:picks});n++;}});
  Object.keys(S.secrets).filter(id=>roleOf(id)==='detective').forEach(id=>{
    const a=act(id), checks=S.secrets[id].checks||[];
    if(!a||checks.some(c=>c.round===round)) return;
    b.update(col('secrets').doc(id),{checks:[...checks,{round,target:a.target,name:nameOf(a.target),isMafia:roleOf(a.target)==='mafia'}]});n++;
  });
  if(!n) return;
  relayBusy=true; try{await b.commit();}catch(e){onErr(e);} relayBusy=false;
}

/* ---------- host: game flow ---------- */
function clearSub(b,name,map){Object.keys(map).forEach(id=>b.delete(col(name).doc(id)));}
function tallyTop(t){const max=Math.max(0,...Object.values(t));const tops=Object.keys(t).filter(k=>t[k]===max);return {max,tops};}
async function finishPhase(deaths,news,next,logs){
  const b=db.batch();
  deaths.forEach(id=>b.update(col('players').doc(id),{alive:false}));
  const aliveIds=S.players.filter(p=>p.alive&&!deaths.includes(p.id)).map(p=>p.id);
  const m=aliveIds.filter(id=>roleOf(id)==='mafia').length, o=aliveIds.length-m;
  const w=m===0?'town':(m>=o?'mafia':null);
  const upd={news,status:next};
  if(w){
    const big=S.players.length>8;
    upd.status='over'; upd.winner=w; upd.news=news+'\n'+(w==='town'?'🏆 فاز الشعب':'🏆 فازت المافيا');
    upd.reveal=S.players.map(p=>({name:p.name,role:roleOf(p.id),alive:aliveIds.includes(p.id)}));
    S.players.forEach(p=>{const t=ROLES[roleOf(p.id)]?.team;const add=w==='town'&&t==='town'?2:(w==='mafia'&&t==='mafia'?(big?3:2):0);
      if(add) b.update(col('players').doc(p.id),{points:(p.points||0)+add});});
    logs.push(w==='town'?'🏆 فاز الشعب':'🏆 فازت المافيا');
  }
  b.update(roomRef(S.code),upd);
  b.set(col('secrets').doc('_log'),{lines:[...(S.secrets._log?.lines||[]),...logs].slice(-100)});
  await b.commit();
}
const H={
  adj(arg){const [k,dl]=arg.split(':');const d=curDist();const i=KEYS.indexOf(k);d[i]=Math.max(0,d[i]+Number(dl));roomRef(S.code).update({customDist:d});},
  distReset(){roomRef(S.code).update({customDist:null});},
  async deal(){
    const n=S.players.length, d=curDist(), sum=d.reduce((a,b)=>a+b,0);
    if(n<3) return toast('تحتاج 3 لاعبين على الأقل');
    if(sum!==n) return toast(`مجموع الشخصيات (${sum}) لازم يساوي عدد اللاعبين (${n})`);
    if(d[0]<1) return toast('لازم يكون في مافيا واحد على الأقل');
    let bag=[]; KEYS.forEach((k,i)=>{for(let j=0;j<d[i];j++)bag.push(k)});
    bag=shuffle(bag); const ids=shuffle(S.players.map(p=>p.id));
    const role={}; ids.forEach((id,i)=>role[id]=bag[i]);
    const mafia=ids.filter(id=>role[id]==='mafia'), game=(S.room.gameNo||0)+1;
    const b=db.batch();
    ids.forEach(id=>{
      b.set(col('secrets').doc(id),{role:role[id],game,checks:[],mafiaPicks:{},
        teammates:role[id]==='mafia'?mafia.filter(x=>x!==id).map(x=>({id:x,name:nameOf(x)})):[]});
      b.update(col('players').doc(id),{alive:true});
    });
    clearSub(b,'actions',S.actions); clearSub(b,'votes',S.votes);
    b.update(roomRef(S.code),{status:'day0',round:0,gameNo:game,news:'',winner:null,reveal:null});
    b.set(col('secrets').doc('_log'),{lines:[...(S.secrets._log?.lines||[]),`🎴 لعبة ${game}: توزعت الشخصيات على ${n} لاعبين`].slice(-100)});
    await b.commit();
  },
  async night(){
    const b=db.batch(); clearSub(b,'actions',S.actions); clearSub(b,'votes',S.votes);
    Object.keys(S.secrets).filter(id=>roleOf(id)==='mafia').forEach(id=>b.update(col('secrets').doc(id),{mafiaPicks:{}}));
    b.update(roomRef(S.code),{status:'night',round:S.room.round+1,news:''}); await b.commit();
  },
  async resolve(){
    const round=S.room.round, alive=alivePlayers(), isAlive=id=>alive.some(p=>p.id===id);
    const act=id=>{const a=S.actions[id];return a&&a.round===round&&isAlive(a.target)?a.target:null};
    const tally={}; alive.filter(p=>roleOf(p.id)==='mafia').forEach(p=>{const t=act(p.id);if(t&&roleOf(t)!=='mafia')tally[t]=(tally[t]||0)+1;});
    const {tops}=tallyTop(tally); const target=tops.length?tops[rnd(tops.length)]:null;
    const doc=alive.find(p=>roleOf(p.id)==='doctor'), prot=doc?act(doc.id):null;
    const logs=[`🌙 الليلة ${round}: المافيا اختارت ${target?nameOf(target):'لا أحد'}، الطبيب حمى ${prot?nameOf(prot):'لا أحد'}`];
    let news, deaths=[];
    if(!target) news='😮‍💨 ما مات أحد الليلة';
    else if(target===prot) news='💉 المافيا هاجمت، بس الطبيب أنقذ الشخص. ما مات أحد';
    else { deaths=[target]; news=`💀 مات الليلة: ${nameOf(target)}`; }
    logs.push(news); await finishPhase(deaths,news,'morning',logs);
  },
  async vote(){const b=db.batch();clearSub(b,'votes',S.votes);b.update(roomRef(S.code),{status:'vote'});await b.commit();},
  async closeVote(){
    const alive=alivePlayers(), isAlive=id=>alive.some(p=>p.id===id), tally={};
    Object.entries(S.votes).forEach(([v,t])=>{if(isAlive(v)&&isAlive(t)&&v!==t)tally[t]=(tally[t]||0)+1;});
    const {max,tops}=tallyTop(tally); let news, deaths=[];
    if(tops.length===1){deaths=[tops[0]];news=`⚖️ الشعب طلّع ${nameOf(tops[0])} (${max} أصوات)`;}
    else news=tops.length?'⚖️ تعادل بالأصوات، ما طلع أحد':'⚖️ ما صوّت أحد';
    await finishPhase(deaths,news,'result',[news]);
  },
  async lobby(){
    const b=db.batch(); clearSub(b,'actions',S.actions); clearSub(b,'votes',S.votes);
    Object.keys(S.secrets).filter(id=>id!=='_log').forEach(id=>b.delete(col('secrets').doc(id)));
    S.players.forEach(p=>b.update(col('players').doc(p.id),{alive:true}));
    b.update(roomRef(S.code),{status:'lobby',news:'',winner:null,reveal:null}); await b.commit();
  },
  kick(id){if(confirm('تشيل هاللاعب؟'))col('players').doc(id).delete();},
  resetPoints(){if(!confirm('تصفّر النقاط؟'))return;const b=db.batch();S.players.forEach(p=>b.update(col('players').doc(p.id),{points:0}));b.commit();},
  end(){if(confirm('تنهي الجلسة وتمسحها؟'))roomRef(S.code).delete();}
};

  if(st==='result') ctrl=`<div class="box news">${esc(r.news)}</div><button class="btn main" data-a="h" data-v="night">الليلة الجاية 🌙</button>`;
  if(st==='over') ctrl=`<div class="phase">${winText(r.winner)}</div><button class="btn main" data-a="h" data-v="deal">لعبة جديدة بنفس اللاعبين</button>
    <button class="btn" data-a="h" data-v="lobby">رجوع للانتظار (لاعبين جدد أو تعديل التوزيع)</button>`;
  return `${topBar('غرفة '+esc(r.code),phaseTag())}<div class="cols"><div>
    <div class="box">${ctrl}</div>
    ${st==='lobby'?`<div class="box center"><div id="qr" class="qr"></div><p class="sub" style="margin-top:8px;word-break:break-all">${esc(joinUrl(r.code))}</p></div>`:''}
  </div><div>
    <div class="box"><h3 style="margin-top:0">اللاعبين (${alive.length}/${n})</h3>
      ${S.players.map(p=>`<div class="row"><span class="${p.alive?'':'dead'}">${esc(p.name)}</span>${st==='lobby'?`<button class="btn small" data-a="kick" data-v="${p.id}">شيل</button>`:tagRole(roleOf(p.id))}</div>`).join('')||'<p class="sub">ما دخل أحد للحين</p>'}</div>
    <div class="box"><h3 style="margin-top:0">النقاط</h3>${board()}<button class="btn small" style="margin-top:10px" data-a="h" data-v="resetPoints">صفّر النقاط</button></div>
    <div class="box"><h3 style="margin-top:0">السجل (لك بس)</h3><div class="log">${[...(S.secrets._log?.lines||[])].reverse().map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>
  </div></div>
  <button class="btn" data-a="leave">اطلع من الجلسة</button><button class="btn small" style="margin-top:10px" data-a="h" data-v="end">امسح الجلسة</button>`;
}

function render(){
  $app.className=(S.mode==='tv'||S.mode==='host')&&S.screen==='room'?'wide':'';
  let html='';
  if(S.screen==='home') html=vHome();
  else if(S.screen==='join') html=vJoin();
  else if(S.screen==='name') html=vName();
  else if(S.screen==='rules') html=vRules();
  else if(!S.room) html='<p class="center sub" style="margin-top:30vh">جاري الاتصال…</p>';
  else if(S.mode==='tv') html=vTV();
  else if(S.mode==='host') html=isHost()?vHost():'<div class="box">هالجهاز مو جهاز المشرف.<button class="btn" data-a="leave">رجوع</button></div>';
  else html=vPlayer();
  const keep=document.activeElement?.id, val=keep?document.getElementById(keep)?.value:null;
  $app.innerHTML=html;
  if(keep&&document.getElementById(keep)&&val!=null){const el=document.getElementById(keep);el.value=val;el.focus();}
  const q=document.getElementById('qr'); if(q&&window.QRCode) new QRCode(q,{text:joinUrl(S.code),width:S.mode==='tv'?260:180,height:S.mode==='tv'?260:180});
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return; const v=b.dataset.v;
  ({create:createRoom,
    goJoin:()=>{S.joinTV=false;S.screen='join';render()},
    goTV:()=>{S.joinTV=true;S.screen='join';render()},
    resume:()=>{const l=JSON.parse(ls.get('mafia_last')||'null');if(!l)return;if(!ready())return toast('انتظر ثواني لين يتصل');S.joinTV=l.mode==='tv';joinFlow(l.code)},
    rules:()=>{S.screen='rules';render()}, home:()=>{S.screen='home';render()},
    join:()=>joinFlow(document.getElementById('code').value.trim()),
    name:()=>joinPlayer(document.getElementById('name').value.trim()),
    leave, reveal:()=>{S.revealed=true;render()}, hide:()=>{S.revealed=false;render()},
    act:()=>act(v), vote:()=>castVote(v),
    adj:()=>H.adj(v), distReset:()=>H.distReset(), kick:()=>H.kick(v), h:()=>H[v]()
  }[b.dataset.a]||(()=>{}))();
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(document.getElementById('code'))document.querySelector('[data-a=join]').click();else if(document.getElementById('name'))document.querySelector('[data-a=name]').click();});
render();

</script>
</body>
</html>
