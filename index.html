<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مافيا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --night:#15111b; --panel:#201a28; --panel2:#2a2233; --line:#3a3045;
  --brass:#c9a227; --blood:#9b1d30; --cream:#efe6d8; --muted:#a59cad; --ok:#4f9d69;
  --display:"Reem Kufi","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.6;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:20px 16px 60px}
#app.wide{max-width:1200px}
h1{font-family:var(--display);font-size:44px;font-weight:700;color:var(--brass);line-height:1.1}
h2{font-family:var(--display);font-size:26px;font-weight:700;margin-bottom:10px}
h3{font-size:18px;font-weight:700;margin:18px 0 8px;color:var(--brass)}
p.sub{color:var(--muted)}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--cream);
  font:700 18px var(--body);padding:15px 18px;border-radius:12px;cursor:pointer;margin-top:10px;text-align:center}
.btn.main{background:var(--blood);border-color:var(--blood)}
.btn.gold{background:var(--brass);border-color:var(--brass);color:#1b1408}
.btn.small{display:inline-block;width:auto;font-size:14px;padding:7px 12px;margin:0}
.btn:disabled{opacity:.4}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--cream);font:700 20px var(--body);
  padding:14px;border-radius:12px;text-align:center;margin-top:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.warn{background:#3a2a10;border-color:var(--brass)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dead{opacity:.45;text-decoration:line-through}
.tag{font-size:13px;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.mafia{background:#4a1520;color:#ffc9d0}.tag.people{background:#173226;color:#c6f0d3}.tag.neutral{background:#3a3115;color:#f3e2a6}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.code{font-family:var(--display);font-size:22px;color:var(--brass)}
.phase{font-family:var(--display);font-size:32px;text-align:center;margin:8px 0}
.news{font-size:20px;text-align:center;white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.pick{border:1px solid var(--line);background:var(--panel2);color:var(--cream);font:700 17px var(--body);padding:16px 8px;border-radius:12px;cursor:pointer}
.pick.on{border-color:var(--brass);background:#3b3014}
.log{font-size:14px;color:var(--muted);max-height:220px;overflow:auto}
.center{text-align:center}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--brass);color:#1b1408;
  font-weight:700;padding:10px 18px;border-radius:30px;display:none;z-index:9;max-width:90%}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin-top:10px}
/* the role card */
.card{perspective:1200px;width:min(78vw,300px);aspect-ratio:560/865;margin:16px auto;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;
  border:3px solid var(--brass);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.back{background:repeating-linear-gradient(45deg,#2a1520 0 10px,#22101a 10px 20px)}
.back b{font-family:var(--display);font-size:40px;color:var(--brass)}
.front{background:var(--panel);transform:rotateY(180deg)}
.front .ic{font-size:72px;line-height:1}
.front .nm{font-family:var(--display);font-size:38px;color:var(--brass);margin:8px 0}
.front.pic{padding:0;border:0;overflow:hidden;border-radius:16px;background:#000}.front.pic img{width:100%;height:100%;object-fit:fill;display:block}
.card:not(.flip)+.extra{visibility:hidden}
.extra{text-align:center;color:var(--brass);font-weight:700;margin-top:-4px}
.thumb{width:100%;max-width:260px;display:block;margin:10px auto 0;border-radius:12px}
.front small{color:var(--muted);font-size:15px}
/* TV */
.tv h1{font-size:72px}.tv .phase{font-size:64px}.tv .news{font-size:34px}
.tv .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tv .pick{font-size:24px;cursor:default}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.card .in{transition:none}}

.tag.town{background:#16283f;color:#cfe3ff}
.cardimg{width:min(80vw,300px);display:block;margin:0 auto 12px;border-radius:16px}

.player-tile{display:flex;flex-direction:column;align-items:center;width:100%;border:1px solid var(--line);border-radius:14px;background:#080808;color:var(--cream);padding:8px;gap:7px;font:700 18px var(--body);text-align:center;overflow:hidden}
button.player-tile{cursor:pointer}.player-tile.on{border:2px solid var(--brass);box-shadow:0 0 0 2px #c9a22744}
.player-portrait{width:100%;max-width:220px;aspect-ratio:1;perspective:900px}
.status-flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(0deg)}
.player-tile.fallen .status-flip{transform:rotateY(180deg)}
.status-front,.status-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.status-back{transform:rotateY(180deg)}
.status-flip img{display:block;width:100%;height:100%;object-fit:contain;border-radius:10px}
.player-name{overflow-wrap:anywhere;line-height:1.35}.player-state{font-size:13px;color:var(--muted)}
.player-tile.fallen .player-state{color:#ff9d9d}
.player-tile.falling .status-flip{animation:playerDeathFlip .75s ease both}
@keyframes playerDeathFlip{from{transform:rotateY(0deg)}to{transform:rotateY(180deg)}}
.player-slot{min-width:0;text-align:center}.player-slot>.tag{display:inline-block;margin-top:6px}
@media(max-width:450px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player-tile{font-size:17px}}
@media(prefers-reduced-motion:reduce){.player-tile.falling .status-flip{animation:none}}

/* Atmospheric artwork, with opaque controls for readable play. */
body{background:#100d12;--scene-image:none;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(180deg,rgba(9,8,13,.32),rgba(9,8,13,.76) 60%,rgba(9,8,13,.94)),var(--scene-image);background-size:cover;background-position:center;background-repeat:no-repeat}
#app{position:relative}
.box{background:rgba(25,20,31,.94);border-color:#6f573946;box-shadow:0 12px 32px #0003}
.btn{background:#2b2232;box-shadow:0 5px 16px #0003}.btn.main{background:linear-gradient(135deg,#9b1d30,#631724);border-color:#b54650}
.btn.gold{background:linear-gradient(135deg,#e0bb54,#ac8128);border-color:#e0bb54}
.box.warn{background:rgba(58,42,16,.96);border-color:var(--brass)}
.btn:hover{filter:brightness(1.09)}.pick{background:#261e2c}.pick.on{background:#493917}
.welcome-art,.stage-art{position:relative;overflow:hidden;border:1px solid #b58c455c;border-radius:20px;background-image:linear-gradient(180deg,#09070b08,#09070bba),var(--scene-image);background-size:cover;background-position:center;box-shadow:0 14px 40px #0005}
.welcome-art{min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:26px 20px;margin-top:10px}
.welcome-art h1{font-size:72px;color:#edcf81;text-shadow:0 3px 20px #000;letter-spacing:2px}
.welcome-art .sub{color:#f0e6d8;text-shadow:0 2px 7px #000;max-width:370px;margin-top:10px}
.scene-eyebrow{display:inline-block;padding:3px 12px;border:1px solid #d1a65d66;border-radius:30px;font-size:13px;color:#edcf81;background:#160f15b3;margin-bottom:10px}
.stage-art{min-height:120px;display:flex;align-items:flex-end;justify-content:space-between;padding:16px 20px;margin-bottom:18px;gap:12px}
.stage-caption{font-family:var(--display);font-size:27px;color:#f6e8c7;text-shadow:0 2px 12px #000}
.stage-round{color:#edcf81;background:#100a13cf;border-radius:20px;padding:3px 12px;font-size:14px;white-space:nowrap}
body[data-scene="night"] .stage-art{background-position:center 44%}
body[data-scene="day"] .stage-art{background-position:center 65%}
body[data-mode="tv"] .stage-art{min-height:185px;padding:24px 30px}
body[data-mode="tv"] .stage-caption{font-size:42px}
body[data-mode="tv"] .stage-round{font-size:22px}
@media(max-width:450px){.welcome-art{min-height:255px}.welcome-art h1{font-size:58px}.stage-art{min-height:100px;padding:14px}.stage-caption{font-size:23px}}
@media(prefers-reduced-motion:reduce){.btn:hover{filter:none}}
.cd{font-variant-numeric:tabular-nums}

.player-portrait{display:block;width:100%;aspect-ratio:666/744;container-type:inline-size;max-width:240px}
.status-flip,.status-front,.status-back{display:block}
.plate-name{position:absolute;left:17.5%;width:49%;top:70.5%;height:15%;display:flex;align-items:center;justify-content:center;
  color:#1b1b1b;font:800 16px var(--display);font-size:clamp(11px,10cqw,30px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.player-tile .player-name{visibility:hidden;height:0;line-height:0}
.player-tile.fallen .player-name{visibility:visible;height:auto;line-height:1.35;text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:#e04545;color:#f0e6d8;font-size:20px}
.tv .player-tile.fallen .player-name{font-size:24px}
.player-tile{background:transparent;border-color:transparent}
.player-tile.fallen .player-state{color:#ff9d9d}

.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.home-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:128px;padding:18px 10px;
  border:1px solid #6f573966;border-radius:18px;background:rgba(32,26,40,.92);color:#edcf81;font:700 18px var(--body);cursor:pointer;box-shadow:0 10px 26px #0004;transition:transform .15s,filter .15s}
.home-btn span{color:var(--cream)}
.home-btn.primary{background:linear-gradient(145deg,#9b1d30,#5e1522);border-color:#b54650;color:#fff}
.home-btn:active{transform:scale(.97)}.home-btn:hover{filter:brightness(1.1)}
.home-btn:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.home-resume{display:flex;align-items:center;justify-content:center;gap:10px}
@media(prefers-reduced-motion:reduce){.home-btn{transition:none}}

/* ---------- friendlier UI ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;transition:transform .12s,filter .15s}
.btn.small{display:inline-flex;gap:6px;border-radius:10px}
.btn:active{transform:scale(.97)}
.btn .ic{flex:none;opacity:.95}
.with-ic{display:flex;align-items:center;gap:8px}
.with-ic .ic{color:var(--brass);flex:none}
.box{border-radius:18px}
.box>h3:first-child{padding-bottom:8px;border-bottom:1px solid #6f573933}
input{border-radius:14px;background:rgba(20,16,26,.9);transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--brass);box-shadow:0 0 0 4px #c9a2271f;outline:none}
#code{font-family:var(--display);font-size:34px;letter-spacing:12px}
.hero-ic{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;margin:14px auto 14px;color:#edcf81;
  background:radial-gradient(circle at 32% 28%,#3e2c40,#17121d 70%);border:1px solid #c9a22766;box-shadow:0 0 0 7px #c9a2270d,0 12px 32px #0007}
.hero-ic.night{color:#bcd0ff;border-color:#7d97d966;box-shadow:0 0 0 7px #7d97d90f,0 12px 32px #0007}
.hero-ic.dead{color:#ff9d9d;border-color:#b5465066}
.hero-ic.gold{color:#1b1408;background:radial-gradient(circle at 32% 28%,#f2d47a,#a87c22 75%);border-color:#f2d47a}
.pick{text-align:center;border-radius:14px;transition:transform .12s,border-color .15s,background .15s;min-height:58px}
.pick:active{transform:scale(.96)}
.pick.on{box-shadow:0 0 0 3px #c9a22733}
.row b{font-variant-numeric:tabular-nums}
.tag{border:1px solid #ffffff10}
.dots{display:inline-flex;gap:3px;margin-inline-start:6px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--brass);animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.top .btn.small{padding:8px 12px}
@media(prefers-reduced-motion:reduce){.btn,.pick{transition:none}.dots i{animation:none}}

/* ---------- scene art as full-page background ---------- */
body::before{background-image:linear-gradient(180deg,rgba(9,8,13,.05) 0%,rgba(9,8,13,.22) 50%,rgba(9,8,13,.55) 100%),var(--scene-image)!important;background-position:center 70%!important;filter:brightness(1.35) saturate(1.15)}
.welcome-art,.stage-art{background:none!important;border:0!important;box-shadow:none!important;border-radius:0}
.welcome-art{min-height:34vh;padding:20px 8px 6px}
.welcome-art h1{font-size:84px;text-shadow:0 4px 30px #000,0 0 2px #000}
.stage-art{min-height:auto;padding:6px 2px 0;margin-bottom:10px;align-items:center}
.stage-caption{font-size:30px;text-shadow:0 2px 16px #000,0 0 2px #000}
body[data-mode="tv"] .stage-caption{font-size:48px}
.box{background:rgba(20,16,26,.68)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:#ffffff14!important}
.box.warn{background:rgba(58,42,16,.82)!important}
.home-btn{background:rgba(24,19,30,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:#ffffff1f}
.home-btn.primary{background:linear-gradient(145deg,rgba(155,29,48,.92),rgba(94,21,34,.92))}
.pick{background:rgba(38,30,44,.78)}
.top{text-shadow:0 2px 8px #000}
@media(max-width:450px){.welcome-art{min-height:30vh}.welcome-art h1{font-size:70px}.stage-caption{font-size:26px}}
.stage-art + .top > .tag,.stage-art + .tv > .top > .tag{display:none}
</style>
</head>

  const b=db.batch(); let n=0; const round=S.room.round;
  const act=id=>{const a=S.actions[id];return a&&a.round===round&&alivePlayers().some(p=>p.id===id)&&alivePlayers().some(p=>p.id===a.target)&&a.target!==id?a:null};
  const mafia=Object.keys(S.secrets).filter(id=>isMafiaRole(roleOf(id)));
  const agreement=mafiaAgreement(S.players,S.secrets,S.actions,round),picks=agreement.picks;
  mafia.forEach(id=>{
    if(stable(S.secrets[id].mafiaPicks)!==stable(picks)||JSON.stringify(S.secrets[id].mafiaAgreement)!==JSON.stringify(agreement)){
      b.update(col('secrets').doc(id),{mafiaPicks:picks,mafiaAgreement:agreement});n++;
    }
  });
  Object.keys(S.secrets).filter(id=>roleOf(id)==='journalist').forEach(id=>{
    const a=act(id), checks=S.secrets[id].checks||[];

}

function clearSub(b,name,map){Object.keys(map).forEach(id=>b.delete(col(name).doc(id)));}

// Pure rule calculations are also exercised by the accompanying verification.
function voteWeight(role){return role==='mayor'?2:1;}
function teamWinner(ids,role){
  const m=ids.filter(id=>isMafiaRole(role(id))).length;
  return ids.length===0?'draw':m===0?'town':m>=ids.length-m?'mafia':null;
}
function endPoints(role,winner,alive,n){
  if(role==='survivor') return alive?3:0;
  if(ROLES[role]?.team==='town') return winner==='town'?2:0;
  if(isMafiaRole(role)) return winner==='mafia'?(n>8?3:2):0;
  return 0;
}
function mafiaAgreement(players,secrets,actions,round){
  const alive=players.filter(p=>p.alive),living=new Set(alive.map(p=>p.id));
  const voters=alive.filter(p=>secrets[p.id]?.role==='mafia');
  const picks={};
  voters.forEach(p=>{const a=actions[p.id];if(a&&a.round===round&&living.has(a.target)&&a.target!==p.id&&!isMafiaRole(secrets[a.target]?.role))picks[p.id]=a.target;});
  const targets=[...new Set(Object.values(picks))];
  const ready=voters.length===0||(Object.keys(picks).length===voters.length&&targets.length===1);
  return {round,ready,target:ready?(targets[0]||null):null,total:voters.length,submitted:Object.keys(picks).length,picks,voters:voters.map(p=>p.id)};
}
function nightOutcome(players,secrets,actions,round,choose){
  const living=players.filter(p=>p.alive), ids=new Set(living.map(p=>p.id));
  const role=id=>secrets[id]?.role;
  const target=id=>{const a=actions[id];return a&&a.round===round&&ids.has(a.target)?a.target:null;};
  const agreement=mafiaAgreement(players,secrets,actions,round),mafiaTarget=agreement.target;
  const shields=living.filter(p=>role(p.id)==='doctor').map(p=>({target:target(p.id),used:false})).filter(x=>x.target);
  const attempts=mafiaTarget?[{target:mafiaTarget,source:'mafia'}]:[], spent=[];
  living.filter(p=>role(p.id)==='police'&&(secrets[p.id].bullets??2)>0).forEach(p=>{
    const t=target(p.id);if(t&&t!==p.id){attempts.push({target:t,source:p.id});spent.push(p.id);}
  });
  const counts={}, deaths=[], bonuses={}, blocked=[];
  for(const hit of attempts){
    if(deaths.includes(hit.target))continue;
    counts[hit.target]=(counts[hit.target]||0)+1;
    const guard=shields.find(x=>x.target===hit.target&&!x.used);
    if(guard){guard.used=true;blocked.push(hit.target);continue;}
    deaths.push(hit.target);
    if(hit.source!=='mafia'&&role(hit.target)==='mafia')bonuses[hit.source]=(bonuses[hit.source]||0)+2;
  }
  return {deaths,bonuses,spent,blocked,mafiaTarget,agreement,shield:{shields,round}};
}
async function finishPhase(deaths,news,next,logs,options={}){
  const b=db.batch(), points={...options.points};
  deaths=[...new Set(deaths)].filter(id=>S.players.some(p=>p.id===id&&p.alive));
  const saved=S.secrets._shield;
  const guards=saved?.shields?saved.shields.map(x=>({...x})):saved?.target?[{target:saved.target,used:saved.used}]:[];
  const blockedNow=[];
  if(!options.protectionApplied&&saved&&saved.game===S.room.gameNo&&saved.round===S.room.round){
    deaths=deaths.filter(id=>{const guard=guards.find(x=>x.target===id&&!x.used);if(!guard)return true;guard.used=true;blockedNow.push(id);return false;});
    if(blockedNow.length){
      b.set(col('secrets').doc('_shield'),{shields:guards,round:saved.round,game:saved.game});
      const source=S.room.status==='revenge'?'اختيار الانتحاري':S.room.status==='vote'?'التصويت':'محاولة الإقصاء';
      const protectionNews=`🛡️ حماية الدكتور أنقذت ${blockedNow.map(nameOf).join('، ')} من ${source}. استُهلكت الحماية.`;
      news=S.room.status==='revenge'?S.room.news+'\n'+protectionNews:protectionNews;
      logs=[protectionNews];
    }
  }
  if(options.shield)b.set(col('secrets').doc('_shield'),{...options.shield,game:S.room.gameNo});
  deaths.forEach(id=>{
    b.update(col('players').doc(id),{alive:false});
    if(roleOf(id)==='suicidal') points[id]=(points[id]||0)+(S.room.round<=1?3:S.room.round===2?1:0);
  });
  Object.entries(options.secretUpdates||{}).forEach(([id,patch])=>b.update(col('secrets').doc(id),patch));
  const aliveIds=S.players.filter(p=>p.alive&&!deaths.includes(p.id)).map(p=>p.id);
  const queue=[...(options.queue||[]),...deaths.filter(id=>roleOf(id)==='suicidal')];
  const pending=aliveIds.length?queue:[];
  // Finish the death choice BEFORE parity or a team's victory is evaluated.
  const w=pending.length?null:teamWinner(aliveIds,roleOf);
  const upd={news,status:pending.length?'revenge':next,pendingRevenge:pending,resumePhase:next};
  if(w){
    upd.status='over'; upd.winner=w; upd.news=news+'\n'+winText(w);
    upd.reveal=S.players.map(p=>({name:p.name,role:roleOf(p.id),alive:aliveIds.includes(p.id)}));
    S.players.forEach(p=>{points[p.id]=(points[p.id]||0)+endPoints(roleOf(p.id),w,aliveIds.includes(p.id),S.players.length);});
    logs.push(winText(w));
  }
  Object.entries(points).forEach(([id,add])=>{if(add)b.update(col('players').doc(id),{points:firebase.firestore.FieldValue.increment(add)});});
  upd.deadline=dlFor(upd.status);
  b.update(roomRef(S.code),upd);
  b.set(col('secrets').doc('_log'),{lines:[...(S.secrets._log?.lines||[]),...logs].slice(-100)});
  await b.commit();
}

    S.players.forEach(p=>b.update(col('players').doc(p.id),{alive:true}));
    b.update(roomRef(S.code),{status:'lobby',news:'',winner:null,reveal:null,pendingRevenge:[],resumePhase:null,deadline:null}); await b.commit();
  },
  resolveForce(){return H.resolve(true);},
  revengeForce(){return H.resolveRevenge(true);},
  async pause(){await roomRef(S.code).update({auto:false,deadline:null});},
  async resume(){await roomRef(S.code).update({auto:true,deadline:dlFor(S.room.status,true)});},
  async timer(arg){
    if(S.room.status!=='lobby')return;
    const [k,dir]=arg.split(':'),lim=T_LIM[k];if(!lim)return;
    const v=Math.min(lim[1],Math.max(lim[0],T()[k]+Number(dir)*lim[2]));
    await roomRef(S.code).update({timers:{...T(),[k]:v}});
  },
  async joinSelf(){
    if(S.room.status!=='lobby')return toast('تقدر تنضم بس قبل بداية اللعبة');

  end(){if(confirm('تنهي الجلسة وتمسحها؟'))roomRef(S.code).delete();}
};

let hostBusy=false;
const hostPhases={resolveForce:['night'],revengeForce:['revenge'],deal:['lobby','over'],night:['day0','result'],resolve:['night'],vote:['morning'],closeVote:['vote'],resolveRevenge:['revenge'],lobby:['over']};
async function hostAction(name,arg){
  if(hostBusy||!isHost()||!H[name])return false;
  if(hostPhases[name]&&!hostPhases[name].includes(S.room.status))return false;
  hostBusy=true;
  try{await H[name](arg);return true;}catch(e){onErr(e);return false;}finally{hostBusy=false;}
}

/* ---------- automatic game master (runs on the host device) ---------- */
let autoKey='';
function nightReady(){
  const r=S.room,alive=alivePlayers();
  if(!mafiaAgreement(S.players,S.secrets,S.actions,r.round).ready)return false;
  return alive.every(p=>{
    const role=roleOf(p.id),a=S.actions[p.id],did=!!a&&a.round===r.round;
    if(role==='doctor'||role==='journalist')return did;
    if(role==='police'&&(S.secrets[p.id]?.bullets??2)>0)return did;
    return true;
  });
}
function allVoted(){const alive=alivePlayers();return alive.length>0&&alive.every(p=>S.votes[p.id]);}
async function tick(){
  updateCountdowns();
  if(S.mode!=='host'||!S.room||!isHost()||!autoOn()||hostBusy)return;
  keepAwake();
  const r=S.room,now=Date.now(),key=[r.gameNo,r.round,r.status,(r.pendingRevenge||[])[0]||''].join(':');
  if(key===autoKey)return;
  if(!r.deadline&&dlFor(r.status)){autoKey=key;roomRef(S.code).update({deadline:dlFor(r.status)}).catch(()=>{autoKey='';});return;}
  const late=!!r.deadline&&now>=r.deadline;
  let step=null;
  if(r.status==='day0'&&late)step=['night'];
  else if(r.status==='night'&&(late||nightReady()))step=['resolve',true];
  else if(r.status==='revenge'){const id=r.pendingRevenge?.[0],a=S.actions[id];if((a&&a.round===r.round&&a.target)||late)step=['resolveRevenge',true];}
  else if(r.status==='morning'&&late)step=['vote'];
  else if(r.status==='vote'&&(late||allVoted()))step=['closeVote'];
  else if(r.status==='result'&&late)step=['night'];
  if(!step)return;
  autoKey=key;
  const ok=await hostAction(step[0],step[1]);
  if(!ok)autoKey='';
}
function updateCountdowns(){
  document.querySelectorAll('.cd[data-dl]').forEach(el=>{const d=Number(el.dataset.dl);el.textContent=d?'⏱️ '+fmt((d-Date.now())/1000):'';});
}
let wakeLock=null;
async function keepAwake(){
  if(wakeLock||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;
  try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch(e){}
}
setInterval(tick,1000);

  } else {
    const sec=mySec(), alive=alivePlayers();
    if(!sec&&r.status!=='over') body+=`<div class="box center"><p class="sub">جاري تجهيز شخصيتك…</p></div>`;
    if(!m.alive&&!['over','revenge'].includes(r.status)) body+=`<div class="box center"><div class="hero-ic dead">${ico('skull',40)}</div><h2>انت طالع</h2><p class="sub">تابع بس لا تتكلم</p></div>`;
    if(r.status==='day0') body+=`<p class="center sub" style="margin:10px 0">لا تخلي أحد يشوف جوالك</p>`;
    body+=rolePanel();
    if(r.status==='night'){
      const type=nightType(), mine=S.myAction&&S.myAction.round===r.round?S.myAction.target:null;
      if(!type){ if(m.alive) body+=`<div class="box center"><div class="hero-ic night">${ico('moon',40)}</div><h2>نام…</h2><p class="sub">غمّض عيونك لين يصبح الصبح</p></div>`; }
      else{
        const done=type==='check'&&sec.checks?.find(c=>c.round===r.round);
        const mates=type==='kill'?sec.teammates.map(t=>t.id):[];
        const targets=alive.filter(p=>type==='protect'?true:(p.id!==UID&&!mates.includes(p.id)));
        const label={kill:'منو تقصون الليلة؟',protect:'منو تحمي الليلة؟',check:'منو تفحص الليلة؟',shoot:'تطلق على منو؟'}[type];
        body+=`<h2 style="margin-top:16px">${label}</h2>`;
        if(type==='shoot')body+=`<p>الطلقات المتبقية: ${sec.bullets??2}</p><button class="btn" data-a="skipShot">احتفظ بالطلقة هذه الليلة</button>${S.myAction?.round===r.round&&S.myAction.target===null?'<p>✔ اخترت الاحتفاظ بالطلقة</p>':''}`;
        if(done) body+=`<div class="box center"><b style="font-size:22px">${esc(done.name)}: ${done.isMafia?'مافيا 🔴':'مو مافيا 🟢'}</b></div>`;
        else if(type==='check'&&mine) body+=`<div class="box center"><p class="sub">جاري الفحص…</p></div>`;
        else body+=`<div class="grid">${targets.map(p=>playerTile(p,'act',mine===p.id)).join('')}</div>`;
        if(type==='kill'){
          const agree=sec.mafiaAgreement?.round===r.round?sec.mafiaAgreement:null;
          const pk=agree?.picks||{}, voters=agree?.voters||[];
          const others=sec.teammates.filter(t=>voters.includes(t.id));
          body+=`<div class="box ${agree?.ready?'':'warn'}"><b>${agree?.ready?'✔ اتفقت المافيا على '+esc(nameOf(agree.target)):'⏳ لازم كل أفراد المافيا الأحياء يختارون نفس الشخص'}</b><p>${agree?`${agree.submitted} من ${agree.total} اختاروا`:''}</p></div>`;
          if(others.length)body+=`<h3>اختيارات زملائك الأحياء</h3><div class="box">${others.map(t=>`<div class="row">${esc(t.name)}<span class="tag">${pk[t.id]?esc(nameOf(pk[t.id])):'ما اختار'}</span></div>`).join('')}</div>`;
        }
        if(mine&&!done&&type!=='check') body+=`<p class="center sub" style="margin-top:12px">✔ وصل اختيارك، تقدر تغيّره قبل الصبح</p>`;
      }
    }
    if(r.status==='revenge'){
      if(r.pendingRevenge?.[0]===UID){body+=`<div class="box warn"><h2>اختر شخصًا يموت معك</h2><div class="grid">${alive.map(p=>playerTile(p,'act',S.myAction?.target===p.id)).join('')}</div><p>بعد اختيارك تتنفّذ النتيجة تلقائيًا.</p></div>`;}
      else body+='<div class="box center">انتظر اختيار الانتحاري…</div>';
    }
    if(['morning','result'].includes(r.status)&&r.news) body+=`<div class="box news">${esc(r.news)}</div>`;
    if(r.status==='vote'&&m.alive){
      const mv=S.votes[UID];
      body+=`<h2 style="margin-top:16px">صوّت على منو يطلع</h2><div class="grid">${alive.filter(p=>p.id!==UID).map(p=>playerTile(p,'vote',mv===p.id)).join('')}</div>
      ${mv?'<p class="center sub" style="margin-top:12px">✔ وصل صوتك، تقدر تغيّره</p>':''}`;
    }
    if(r.status==='over') body+=`<div class="box center"><div class="hero-ic gold">${ico('trophy',42)}</div><div class="phase">${winText(r.winner)}</div><p>نقاطك: <b>${m.points||0}</b></p></div><div class="box">${revealList()}</div>`;
  }
  if(r.status!=='lobby')body+=`<div class="box"><h3 style="margin-top:0">اللاعبون</h3><div class="grid">${S.players.map(p=>playerTile(p)).join('')}</div></div>`;
  return body;
}
function vPlayer(){
  const m=me();
  if(!m) return `<div class="box center">مو موجود في هالجلسة.<button class="btn" data-a="leave">رجوع</button></div>`;
  return topBar(esc(m.name),phaseTag())+playerBody();
}
function vTV(){
  const r=S.room, alive=alivePlayers(); let body='';
  if(r.status==='lobby') body=`<div class="cols"><div class="center"><p class="sub" style="font-size:24px">امسح الكود أو ادخل الرقم</p>
    <h1 style="font-size:110px">${esc(r.code)}</h1><div id="qr" class="qr"></div></div>
    <div><h2>اللاعبين (${S.players.length})</h2><div class="grid">${S.players.map(p=>playerTile(p)).join('')}</div></div></div>`;
  else if(r.status==='over') body=`<div class="phase">${winText(r.winner)}</div><div class="cols"><div class="box">${revealList()}</div><div class="box"><h2>الترتيب</h2>${board()}</div></div>`;
  else body=`<div class="phase">${PHASE[r.status]}</div>
    ${r.status==='day0'?'<p class="news">كل واحد يكشف شخصيته على جواله بسرية 🤫</p>':''}
    ${r.status==='night'?'<p class="news">الكل يغمّض… أصحاب الأدوار يختارون من جوالاتهم</p>':''}
    ${['morning','result'].includes(r.status)&&r.news?`<div class="box news">${esc(r.news)}</div>`:''}
    ${r.status==='vote'?`<p class="news">صوّتوا من جوالاتكم (${Object.keys(S.votes).filter(id=>alive.some(p=>p.id===id)).length}/${alive.length})</p>`:''}
    <div class="grid" style="margin-top:20px">${S.players.map(p=>playerTile(p)).join('')}</div>`;
  return `<div class="tv">${topBar('غرفة '+esc(r.code),r.round?'جولة '+r.round:PHASE[r.status])}${body}</div>`;
}
function hostPointsBoard(){
  return [...S.players].sort((a,b)=>(b.points||0)-(a.points||0)).map(p=>`<div class="box" style="margin-top:8px;padding:10px"><b>${esc(p.name)}</b><div style="display:flex;gap:8px;align-items:center;margin-top:6px"><button class="btn small" data-a="pointsAdj" data-v="${p.id}:-1" aria-label="تقليل نقاط ${esc(p.name)}">−</button><input id="points_${p.id}" type="number" step="1" min="-1000000" max="1000000" value="${p.points||0}" aria-label="نقاط ${esc(p.name)}" style="width:90px;margin:0;padding:6px"><button class="btn small" data-a="pointsAdj" data-v="${p.id}:1" aria-label="زيادة نقاط ${esc(p.name)}">+</button><button class="btn small" data-a="pointsSet" data-v="${p.id}">حفظ</button></div></div>`).join('');
}
function autoBox(){
  const r=S.room,t=T(),on=autoOn();
  if(r.status==='lobby')return `<div class="box"><h3 style="margin-top:0">🤖 الإدارة التلقائية</h3>
    <div class="row"><span>اللعبة تمشي لحالها</span><button class="btn small noic ${on?'gold':''}" data-a="h" data-v="${on?'pause':'resume'}">${on?'مفعّلة ✔':'متوقفة ✕'}</button></div>
    ${[['reveal','كشف الشخصيات'],['night','مدة الليل'],['talk','مدة النقاش'],['vote','مدة التصويت']].map(([k,l])=>`<div class="row"><span>${l}</span><span style="display:flex;gap:8px;align-items:center"><button class="btn small" data-a="timer" data-v="${k}:-1" aria-label="تقليل ${l}">−</button><b style="min-width:56px;text-align:center">${fmt(t[k])}</b><button class="btn small" data-a="timer" data-v="${k}:1" aria-label="زيادة ${l}">+</button></span></div>`).join('')}
    <p class="sub" style="margin-top:8px">الليل يخلص أول ما الكل يختار، والتصويت أول ما الكل يصوّت، أو لما ينتهي الوقت. خل هالجهاز مفتوح طول اللعبة.</p></div>`;
  return `<div class="row"><span>${on?`🤖 تلقائي <span class="cd" data-dl="${r.deadline||''}"></span>`:'⏸️ الإدارة التلقائية متوقفة'}</span><button class="btn small" data-a="h" data-v="${on?'pause':'resume'}">${on?'إيقاف مؤقت':'شغّل'}</button></div>`;
}
function hostJoinBox(){
  const mine=me();
  return `<div class="box"><h3 style="margin-top:0">🎮 تبي تلعب معاهم؟</h3>${mine
    ?`<p>أنت داخل كلاعب باسم <b>${esc(mine.name)}</b>. بعد البداية بتشوف شخصيتك بس، وأدوار الباقين تنخفي عنك.</p><button class="btn" data-a="leaveSelf">انسحب من اللعب</button>`
    :`<input id="hostName" maxlength="16" placeholder="اسمك"><button class="btn gold" data-a="joinSelf">انضم كلاعب</button>`}</div>`;
}
function playingHostCtrl(){
  const r=S.room,st=r.status,alive=alivePlayers();let c='';
  if(st==='day0')c=`<button class="btn main" data-a="h" data-v="night">ابدأ الليل الحين 🌙</button>`;
  if(st==='night')c=`<button class="btn" data-a="h" data-v="resolveForce">صبّح الحين (اللي ما اختار يفوته)</button>`;
  if(st==='revenge')c=`<button class="btn" data-a="h" data-v="revengeForce">تخطَّ اختيار الانتحاري</button>`;
  if(st==='morning')c=`<button class="btn main" data-a="h" data-v="vote">ابدأ التصويت الحين ⚖️</button>`;
  if(st==='vote')c=`<p class="sub">وصلت ${Object.keys(S.votes).filter(v=>alive.some(p=>p.id===v)).length} من ${alive.length} أصوات</p><button class="btn main" data-a="h" data-v="closeVote">سكّر التصويت الحين</button>`;
  if(st==='result')c=`<button class="btn main" data-a="h" data-v="night">الليلة الجاية الحين 🌙</button>`;
  if(st==='over')c=`<button class="btn main" data-a="h" data-v="deal">لعبة جديدة بنفس اللاعبين</button><button class="btn" data-a="h" data-v="lobby">رجوع للانتظار</button>`;
  return `<div class="box"><h3 style="margin-top:0">🎛️ تحكم المشرف</h3>${autoBox()}${c}</div>`;
}
function vHost(){
  const r=S.room, st=r.status, alive=alivePlayers(), n=S.players.length; let ctrl='';
  if(me()&&st!=='lobby')return `${topBar(esc(me().name)+' • غرفة '+esc(r.code),phaseTag())}${playerBody()}${playingHostCtrl()}
    <div class="box"><h3 style="margin-top:0">النقاط</h3>${board()}</div>
    <button class="btn" data-a="leave">اطلع من الجلسة</button><button class="btn small" style="margin-top:10px" data-a="h" data-v="end">امسح الجلسة</button>`;
  if(st==='lobby'){
    const d=curDist(), sum=d.reduce((a,b)=>a+b,0), ok=validDist(n,d);
    ctrl=`<h3 style="margin-top:0">توزيع الشخصيات (${n} لاعبين)</h3>
    ${KEYS.map((k,i)=>`<div class="row"><span>${ROLES[k].icon} ${ROLES[k].name}</span><span style="display:flex;gap:8px;align-items:center">
      <button class="btn small" data-a="adj" data-v="${k}:-1" ${d[i]===0?'disabled':''} aria-label="تقليل ${ROLES[k].name}">−</button><b style="min-width:24px;text-align:center">${d[i]}</b><button class="btn small" data-a="adj" data-v="${k}:1" ${d[i]>=20?'disabled':''} aria-label="زيادة ${ROLES[k].name}">+</button></span></div>`).join('')}
    <p style="margin-top:8px;color:${ok?'var(--ok)':'#ff8a8a'}">المجموع ${sum} من ${n} ${ok?'✔':'— لازم يساوي عدد اللاعبين'}</p>
    <p class="sub">تقدر تعدّل عدد كل شخصية قبل بدء اللعبة. المجموع لازم يساوي عدد اللاعبين (6 إلى 20). المافيا لا تشمل الجاسوس.</p>
    ${r.customDist?'<button class="btn" data-a="distReset">ارجع للجدول الافتراضي</button>':''}
    <button class="btn main" data-a="h" data-v="deal" ${ok?'':'disabled'}>ابدأ اللعبة ووزّع الشخصيات</button>`;
  }
  if(st==='day0') ctrl=`<p class="sub">كل لاعب يكشف شخصيته على جواله. بعدين ابدأ الليل.</p><button class="btn main" data-a="h" data-v="night">ابدأ الليل 🌙</button>`;
  if(st==='night'){
    const agreement=mafiaAgreement(S.players,S.secrets,S.actions,r.round);
    const actors=alive.filter(p=>['mafia','doctor','journalist'].includes(roleOf(p.id))||(roleOf(p.id)==='police'&&(S.secrets[p.id]?.bullets??2)>0));
    ctrl=`<h3 style="margin-top:0">منو اختار</h3>${actors.map(p=>{const a=S.actions[p.id];const ok=a&&a.round===r.round;return `<div class="row"><span>${esc(p.name)} ${tagRole(roleOf(p.id))}</span><span>${ok?'✔ '+(a.target?esc(nameOf(a.target)):'احتفظ بالطلقة'):'⏳'}</span></div>`}).join('')}
    <p class="sub" style="margin-top:8px">خل هالشاشة مفتوحة بالليل، هي اللي توصل نتيجة الصحفي.</p>
    <p class="${agreement.ready?'sub':'news'}">${agreement.ready?'✔ المافيا متفقة':'⏳ المافيا لازم تتفق على نفس اللاعب ('+agreement.submitted+'/'+agreement.total+')'}</p>
    <button class="btn main" data-a="h" data-v="resolve" ${agreement.ready?'':'disabled'}>صبّح ونفّذ ☀️</button>
    <button class="btn" data-a="h" data-v="resolveForce">صبّح الحين (اللي ما اختار يفوته)</button>`;
  }
  if(st==='revenge')ctrl=`<h2>اختيار الانتحاري</h2><p>بانتظار ${esc(nameOf(r.pendingRevenge?.[0]))} يختار من جواله.</p><button class="btn main" data-a="h" data-v="resolveRevenge">نفّذ الاختيار</button><button class="btn" data-a="h" data-v="revengeForce">تخطَّ</button>`;
  if(st==='morning') ctrl=`<div class="box news">${esc(r.news)}</div><p class="sub" style="margin-top:8px">وقت النقاش. لما يخلصون:</p><button class="btn main" data-a="h" data-v="vote">ابدأ التصويت ⚖️</button>`;
  if(st==='vote'){
    const t={}; Object.entries(S.votes).forEach(([v,x])=>{if(alive.some(p=>p.id===v))t[x]=(t[x]||0)+voteWeight(roleOf(v));});
    ctrl=`<p class="sub">وصلت ${Object.keys(S.votes).filter(v=>alive.some(p=>p.id===v)).length} من ${alive.length} أصوات</p>
    ${Object.entries(t).sort((a,b)=>b[1]-a[1]).map(([x,c])=>`<div class="row"><span>${esc(nameOf(x))}</span><b>${c}</b></div>`).join('')}
    <button class="btn main" data-a="h" data-v="closeVote">سكّر التصويت</button>`;
  }
  if(st==='result') ctrl=`<div class="box news">${esc(r.news)}</div><button class="btn main" data-a="h" data-v="night">الليلة الجاية 🌙</button>`;
  if(st==='over') ctrl=`<div class="phase">${winText(r.winner)}</div><button class="btn main" data-a="h" data-v="deal">لعبة جديدة بنفس اللاعبين</button>
    <button class="btn" data-a="h" data-v="lobby">رجوع للانتظار (لاعبين جدد أو تعديل التوزيع)</button>`;
  return `${topBar('غرفة '+esc(r.code),phaseTag())}<div class="cols"><div>
    ${st==='lobby'?'':`<div class="box">${autoBox()}</div>`}
    <div class="box">${ctrl}</div>
    ${st==='lobby'?autoBox()+hostJoinBox():''}
    ${st==='lobby'?`<div class="box center"><div id="qr" class="qr"></div><p class="sub" style="margin-top:8px;word-break:break-all">${esc(joinUrl(r.code))}</p></div>`:''}
  </div><div>
    <div class="box"><h3 style="margin-top:0">اللاعبين (${alive.length}/${n})</h3>
      <div class="grid">${S.players.map(p=>`<div class="player-slot">${playerTile(p)}${st==='lobby'?`<button class="btn small" style="margin-top:6px" data-a="kick" data-v="${p.id}">شيل</button>`:tagRole(roleOf(p.id))}</div>`).join('')||'<p class="sub">ما دخل أحد للحين</p>'}</div></div>
    <div class="box"><h3 style="margin-top:0">النقاط</h3>${hostPointsBoard()}<button class="btn small" style="margin-top:10px" data-a="h" data-v="resetPoints">صفّر النقاط</button></div>
    <div class="box"><h3 style="margin-top:0">السجل (لك بس)</h3><div class="log">${[...(S.secrets._log?.lines||[])].reverse().map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>
  </div></div>
  <button class="btn" data-a="leave">اطلع من الجلسة</button><button class="btn small" style="margin-top:10px" data-a="h" data-v="end">امسح الجلسة</button>`;
}

function sceneFor(screen,phase){
  if(screen!=='room')return 'home';
  return ['night','revenge'].includes(phase)?'night':['morning','vote','result','over'].includes(phase)?'day':'home';
}
function sceneBanner(){
  return `<div class="stage-art"><span class="stage-caption">${PHASE[S.room.status]||'مافيا'}</span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${S.room.deadline&&autoOn()?`<span class="stage-round cd" data-dl="${S.room.deadline}"></span>`:''}<span class="stage-round">${S.room.round?'الجولة '+S.room.round:'غرفة '+esc(S.room.code)}</span></span></div>`;
}
let rq=0;
function render(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;renderNow();});}
function renderNow(){
  const scene=sceneFor(S.screen,S.room?.status);
  document.body.dataset.scene=scene;document.body.dataset.mode=S.mode||'home';
  document.body.style.setProperty('--scene-image',`url("${SCENE_ART[scene]}")`);
  $app.className=(S.mode==='tv'||S.mode==='host')&&S.screen==='room'?'wide':'';
  let html='';
  if(S.screen==='home') html=vHome();
  else if(S.screen==='join') html=vJoin();
  else if(S.screen==='name') html=vName();
  else if(S.screen==='rules') html=vRules();
  else if(!S.room) html='<p class="center sub" style="margin-top:30vh">جاري الاتصال…</p>';
  else if(S.mode==='tv') html=vTV();
  else if(S.mode==='host') html=isHost()?vHost():'<div class="box">هالجهاز مو جهاز المشرف.<button class="btn" data-a="leave">رجوع</button></div>';
  else html=vPlayer();
  if(S.screen==='room'&&S.room)html=sceneBanner()+html;
  const keep=document.activeElement?.id, val=keep?document.getElementById(keep)?.value:null;
  $app.innerHTML=html;newlyDead.clear();decorate();
  if(keep&&document.getElementById(keep)&&val!=null){const el=document.getElementById(keep);el.value=val;el.focus();}
  updateCountdowns();
  const q=document.getElementById('qr'); if(q&&window.QRCode) new QRCode(q,{text:joinUrl(S.code),width:S.mode==='tv'?260:180,height:S.mode==='tv'?260:180});
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return; const v=b.dataset.v;
  ({create:createRoom,
    goJoin:()=>{S.joinTV=false;S.screen='join';render()},
    goTV:()=>{S.joinTV=true;S.screen='join';render()},
    resume:()=>{const l=JSON.parse(ls.get('mafia_last')||'null');if(!l)return;if(!ready())return toast('انتظر ثواني لين يتصل');S.joinTV=l.mode==='tv';joinFlow(l.code)},
    rules:()=>{S.screen='rules';render()}, home:()=>{S.screen='home';render()},
    join:()=>joinFlow(document.getElementById('code').value.trim()),
    name:()=>joinPlayer(document.getElementById('name').value.trim()),
    leave, reveal:()=>{S.revealed=true;render()}, hide:()=>{S.revealed=false;render()},
    act:()=>act(v), skipShot, vote:()=>castVote(v),
    adj:()=>H.adj(v).catch(onErr), distReset:()=>H.distReset().catch(onErr), pointsAdj:()=>H.adjustPoints(v).catch(onErr), pointsSet:()=>H.setPoints(v).catch(onErr), kick:()=>H.kick(v), h:()=>hostAction(v), timer:()=>H.timer(v).catch(onErr), joinSelf:()=>hostAction('joinSelf'), leaveSelf:()=>hostAction('leaveSelf')
  }[b.dataset.a]||(()=>{}))();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wakeLock=null;tick();}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(document.getElementById('hostName')){hostAction('joinSelf');return;}if(document.getElementById('code'))document.querySelector('[data-a=join]').click();else if(document.getElementById('name'))document.querySelector('[data-a=name]').click();});
render();

</script>
</body>
</html>
